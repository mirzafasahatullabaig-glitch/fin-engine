[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-engine"
version = "1.0.0"
description = "Deterministic financial calculation and verification engine for the local AI business/finance system."
requires-python = ">=3.11"
dependencies = []  # intentionally stdlib-only: Decimal, dataclasses, enum

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
